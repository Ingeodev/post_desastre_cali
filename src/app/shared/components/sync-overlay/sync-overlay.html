@if (globalStore.isSyncing()) {
  <div
    class="fixed inset-0 z-[1200] flex flex-col items-center justify-center gap-4 bg-zinc-950/70 backdrop-blur-sm p4"
    role="status"
    aria-live="polite"
  >
    <div class="w-3/4">
      <p-progressbar [value]="progressValue()" [showValue]="false" />
    </div>
    <div class="flex flex-col items-center gap-1 text-center">
      <span class="text-lg font-semibold text-zinc-50">Sincronizando reportes</span>
      <span class="text-sm text-zinc-300">
        {{ synced() }} de {{ total() }} reportes sincronizados
      </span>
      <span class="text-sm text-zinc-300">
        No cierres la aplicación hasta finalizar el proceso.
      </span>
    </div>
  </div>
}
