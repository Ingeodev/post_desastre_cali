<section class="flex h-full flex-col overflow-hidden">
  <header class="flex items-center justify-between gap-4 px-4 py-3">
    <div class="flex flex-col gap-0.5">
      <h2 class="text-base font-semibold text-zinc-900 dark:text-zinc-50">{{ title() }}</h2>
      <p class="text-xs text-zinc-500 dark:text-zinc-400">{{ stepLabel() }}</p>
    </div>

    <p-button
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      size="small"
      text
      (click)="cancel.emit()"
    />
  </header>

  <div class="flex-1 min-h-0 overflow-y-auto">
    <ng-content />
  </div>

  <footer class="flex items-center justify-between gap-3 px-4 py-3">
    <p-button
      label="Atrás"
      icon="pi pi-arrow-left"
      severity="secondary"
      size="small"
      [disabled]="currentPosition() === 0"
      (click)="onBack()"
    />

    <p-button
      [label]="isOnLastStep() ? finishLabel() : 'Siguiente'"
      [icon]="isOnLastStep() ? 'pi pi-check' : 'pi pi-arrow-right'"
      severity="primary"
      size="small"
      iconPos="right"
      [disabled]="!isCurrentStepValid()"
      (click)="onNext()"
    />
  </footer>
</section>
