<header
  class="sticky top-0 z-10 border-zinc-200 bg-zinc-50/80 pt-[env(safe-area-inset-top)] backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80"
>
  <div class="flex h-14 items-center justify-between px-4">
    <div class="flex items-center gap-2">
      <span
        class="pi pi-map-marker text-xl text-blue-600 dark:text-blue-400"
        aria-hidden="true"
      ></span>
      <span class="font-semibold text-zinc-900 dark:text-zinc-50">EDES</span>
    </div>
    <div class="flex items-center gap-1">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-zinc-500 transition-colors hover:bg-zinc-200/70 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-400 dark:hover:bg-zinc-800/70 dark:hover:text-zinc-50"
        aria-label="Alertas"
      >
        <span class="pi pi-exclamation-triangle text-lg" aria-hidden="true"></span>
      </button>

      @if (globalStore.isSyncing()) {
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full text-blue-600 transition-colors dark:text-blue-400"
          aria-label="Sincronizando"
          disabled
        >
          <span class="pi pi-refresh pi-spin text-lg" aria-hidden="true"></span>
        </button>
      } @else if (globalStore.canSync()) {
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full text-zinc-500 transition-colors hover:bg-zinc-200/70 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-400 dark:hover:bg-zinc-800/70 dark:hover:text-zinc-50"
          aria-label="Sincronizar"
          (click)="globalStore.syncNow()"
        >
          <span class="pi pi-refresh text-lg" aria-hidden="true"></span>
        </button>
      }
    </div>
  </div>
</header>
