<footer
  class="border-b border-zinc-200 bg-zinc-50/90 pb-[env(safe-area-inset-bottom)] text-zinc-500 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90 dark:text-zinc-400"
>
  <nav class="flex h-16 items-center justify-around">
    <a
      routerLink="settings"
      routerLinkActive="text-blue-600 dark:text-blue-400"
      class="flex flex-col items-center gap-1 px-3 py-1 text-xs transition-colors"
      aria-label="Ajustes"
    >
      <span class="pi pi-cog text-lg" aria-hidden="true"></span>
      <span>Ajustes</span>
    </a>
    <a
      routerLink="reportes"
      routerLinkActive="text-blue-600 dark:text-blue-400"
      class="flex flex-col items-center gap-1 px-3 py-1 text-xs transition-colors"
      aria-label="Reportes"
    >
      <span class="pi pi-list text-lg" aria-hidden="true"></span>
      <span>reportes realizados</span>
    </a>
    <a
      routerLink="nuevo-reporte"
      [class.pointer-events-none]="!isReportEnabled()"
      [class.opacity-40]="!isReportEnabled()"
      [attr.aria-disabled]="!isReportEnabled()"
      (click)="onNewReportClick($event)"
      routerLinkActive="text-blue-600 dark:text-blue-400"
      class="flex flex-col items-center gap-1 px-3 py-1 text-xs transition-colors"
      aria-label="Nuevo reporte"
    >
      <span class="pi pi-plus-circle text-lg" aria-hidden="true"></span>
      <span>Nuevo</span>
    </a>
  </nav>
</footer>
