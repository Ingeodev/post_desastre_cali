<main class="h-dvh flex flex-col overflow-hidden">
  <header
    class="sticky top-0 z-10 border-b border-zinc-200 bg-zinc-50/80 pt-[env(safe-area-inset-top)] backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80"
  >
    <div class="flex h-16 items-center justify-between px-3">
      <a
        routerLink="/reportes"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-zinc-500 transition-colors hover:bg-zinc-200/70 hover:text-zinc-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-zinc-400 dark:hover:bg-zinc-800/70 dark:hover:text-zinc-50"
        aria-label="Volver a reportes"
      >
        <span class="pi pi-arrow-left text-lg" aria-hidden="true"></span>
      </a>

      <span class="pl-2 font-semibold text-zinc-900 dark:text-zinc-50">
        Detalle del reporte
      </span>

      <div class="flex w-10 items-center justify-center">
        <span
          class="pi pi-map-marker text-xl text-blue-600 dark:text-blue-400"
          aria-hidden="true"
        ></span>
      </div>
    </div>
  </header>

  <p-toast
    position="top-center"
    [breakpoints]="{ '600px': { width: 'calc(100vw - 1rem)' } }"
  />

  <div class="relative flex-1 overflow-y-auto">
    <router-outlet />
  </div>
</main>
