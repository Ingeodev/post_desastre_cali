<div class="flex flex-col gap-4">
  <header class="flex flex-col gap-1">
    <h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">
      Notas
    </h3>
    <p class="text-xs text-zinc-500 dark:text-zinc-400">
      Información adicional del reporte. Campo opcional.
    </p>
  </header>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label for="notes" class="text-sm font-medium">Notas del reporte</label>
      <textarea
        id="notes"
        formControlName="notes"
        pTextarea
        rows="6"
        class="w-full"
        placeholder="Escribe aquí cualquier observación adicional..."
      ></textarea>
    </div>
  </form>
</div>
