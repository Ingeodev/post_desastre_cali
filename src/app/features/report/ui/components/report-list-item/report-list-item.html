<div
  class="flex w-full items-center gap-3 rounded-xl border border-zinc-200 bg-white p-3 text-left shadow-sm dark:border-zinc-800 dark:bg-zinc-900"
>
  <div
    class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-zinc-100 dark:bg-zinc-800"
  >
    @if (summary().firstPhotoUrl) {
      <img
        [src]="summary().firstPhotoUrl"
        alt="Foto del reporte"
        loading="lazy"
        class="h-full w-full object-cover"
      />
    } @else {
      <span class="pi pi-image text-xl text-zinc-400" aria-hidden="true"></span>
    }
  </div>

  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-50">
      {{ summary().addressText || 'Dirección no registrada' }}
    </p>

    <p-tag
      [value]="summary().damageCategoryLabel || 'Sin categoría'"
      severity="warn"
      class="mt-1 block"
    />

    <p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">
      {{ summary().capturedAt | date: 'medium' }}
    </p>

    @if (summary().notes) {
      <p class="mt-1 line-clamp-2 text-sm text-zinc-600 dark:text-zinc-300">
        {{ summary().notes }}
      </p>
    }
  </div>

  <p-button
    type="button"
    size="small"
    rounded
    text
    raised
    ariaLabel="Ver más"
    (onClick)="goToDetail()"
    styleClass="shrink-0"
  >
    <ng-template #icon>
      <span class="pi pi-arrow-right" aria-hidden="true"></span>
    </ng-template>
  </p-button>
</div>
