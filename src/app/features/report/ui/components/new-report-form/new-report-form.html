<form
  class="flex flex-col gap-4 p-4"
  [formGroup]="form"
  (ngSubmit)="onFinish()"
>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1">
      <label for="damageCategoryId" class="text-sm font-medium">Estime el daño según su criterio</label>
      <p-select
        id="damageCategoryId"
        formControlName="damageCategoryId"
        [options]="damageCategories"
        optionLabel="label"
        optionValue="id"
        placeholder="Selecciona categoría"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="constructionTypeId" class="text-sm font-medium">Tipo de construcción</label>
      <p-select
        id="constructionTypeId"
        formControlName="constructionTypeId"
        [options]="constructionTypes"
        optionLabel="label"
        optionValue="id"
        placeholder="Selecciona tipo"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="dataSourceId" class="text-sm font-medium">Fuente del dato</label>
      <p-select
        id="dataSourceId"
        formControlName="dataSourceId"
        [options]="dataSources"
        optionLabel="label"
        optionValue="id"
        placeholder="Selecciona fuente"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="seismicEventId" class="text-sm font-medium">Evento sísmico</label>
      <p-select
        id="seismicEventId"
        formControlName="seismicEventId"
        [options]="currentSeismicEvent ? [currentSeismicEvent] : []"
        optionLabel="name"
        optionValue="id"
        placeholder="Selecciona evento"
        class="w-full"
      />
    </div>

    <p-floatlabel variant="over">
      <input
        id="addressText"
        formControlName="addressText"
        type="text"
        pInputText
        class="w-full"
      />
      <label for="addressText">Dirección</label>
    </p-floatlabel>

    <p-floatlabel variant="over">
      <p-inputnumber
        id="approxYearBuilt"
        formControlName="approxYearBuilt"
        [min]="1800"
        [max]="2100"
        class="w-full"
      />
      <label for="approxYearBuilt">Año de construcción</label>
    </p-floatlabel>

    <div class="flex flex-col gap-1">
      <label for="numFloors" class="text-sm font-medium">Número de pisos</label>
      <p-inputnumber
        id="numFloors"
        formControlName="numFloors"
        [min]="0"
        class="w-full"
      />
    </div>

    <p-floatlabel variant="over">
      <input
        id="reportedBy"
        formControlName="reportedBy"
        type="text"
        pInputText
        class="w-full"
      />
      <label for="reportedBy">Reportado por</label>
    </p-floatlabel>

    <div class="flex flex-col gap-1 sm:col-span-2">
      <label for="notes" class="text-sm font-medium">Notas</label>
      <textarea id="notes" formControlName="notes" pTextarea rows="3" class="w-full"></textarea>
    </div>
  </div>

  <p-button
    type="submit"
    label="Finalizar reporte"
    size="small"
    severity="primary"
    icon="pi pi-check"
    class="w-full self-end"
  />
</form>
