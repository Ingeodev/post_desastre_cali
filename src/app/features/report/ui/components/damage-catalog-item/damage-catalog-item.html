<div
    class="
        relative
        overflow-hidden
        rounded-xl
        bg-white
        border-4
        transition-all
        duration-150
        active:scale-[0.98]
    "
    [class.border-blue-600]="selected"
    [class.border-transparent]="!selected"
    (click)="select()"
    role="button"
    tabindex="0"
    [attr.aria-pressed]="selected"
    [attr.aria-label]="item.label"
>
    <!-- Imagen -->
    <div class="relative aspect-square w-full overflow-hidden bg-surface-100">

        <img
            [src]="item.reference_image_url"
            [alt]="item.label"
            class="
                absolute
                inset-0
                h-full
                w-full
                object-cover
                transition-transform
                duration-200
            "
            [class.scale-[1.02]]="selected"
        />

        <!-- Botón información -->
        <button
            type="button"
            class="
                absolute
                right-2
                top-2
                flex
                h-9
                w-9
                items-center
                justify-center
                rounded-full
                bg-black/60
                text-white
                backdrop-blur-sm
                transition-colors
                hover:bg-black/75
                active:scale-95
            "
            [attr.aria-label]="'Información sobre ' + item.label"
            (click)="showInfo($event)"
        >
            <i class="pi pi-info text-sm"></i>
        </button>

        <!-- Indicador de seleccionado -->
        @if (selected) {
            <div
                class="
                    absolute
                    left-2
                    top-2
                    flex
                    h-7
                    w-7
                    items-center
                    justify-center
                    rounded-full
                    bg-blue-600
                    text-white
                    shadow-md
                "
            >
                <i class="pi pi-check text-xs"></i>
            </div>
        }
    </div>

    <!-- Pie de foto -->
    <div class="px-3 py-2.5">
        <p
            class="
                line-clamp-2
                text-sm
                font-medium
                leading-5
                text-surface-800
            "
        >
            {{ item.label }}
        </p>
    </div>
</div>
