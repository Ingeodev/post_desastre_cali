<div class="h-56 w-full overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800">
  @if (location()) {
    <mgl-map [mapStyle]="mapStyle" [center]="center()" [zoom]="zoom()">
      <app-report-layer [location]="location()" />
    </mgl-map>
  } @else {
    <div class="flex h-full w-full items-center justify-center bg-zinc-100 dark:bg-zinc-800">
      <span class="pi pi-map-marker text-3xl text-zinc-400" aria-hidden="true"></span>
      <p class="ml-2 text-sm text-zinc-500 dark:text-zinc-400">
        Sin ubicación registrada
      </p>
    </div>
  }
</div>
