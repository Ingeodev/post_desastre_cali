<dl class="divide-y divide-zinc-100 dark:divide-zinc-800">
  @for (row of rows(); track row.label) {
    <div class="flex items-start justify-between gap-4 py-2">
      <dt class="text-sm text-zinc-500 dark:text-zinc-400">{{ row.label }}</dt>
      <dd class="text-right text-sm font-medium text-zinc-900 dark:text-zinc-50">
        @if (row.label === 'Fecha de captura' && row.value) {
          {{ row.value | date: 'medium' }}
        } @else {
          {{ row.value }}
        }
      </dd>
    </div>
  }
</dl>
