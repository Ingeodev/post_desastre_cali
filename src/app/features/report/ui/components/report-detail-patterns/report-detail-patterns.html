@if (labels().length === 0) {
  <p class="text-sm text-zinc-500 dark:text-zinc-400">
    No se registraron patrones de daño.
  </p>
} @else {
  <ul class="space-y-2">
    @for (item of labels(); track item.id) {
      <li
        class="flex items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 dark:border-zinc-800 dark:bg-zinc-900"
      >
        <span class="pi pi-exclamation-triangle text-sm text-amber-500" aria-hidden="true"></span>
        <span class="text-sm text-zinc-800 dark:text-zinc-200">{{ item.label }}</span>
      </li>
    }
  </ul>
}
