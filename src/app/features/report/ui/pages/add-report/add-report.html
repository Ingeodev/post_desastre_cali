<div class="h-full">
  <div class="h-96">
    <app-map-form/>
  </div>
  
  <input
    #cameraInput
    type="file"
    accept="image/*"
    capture="environment"
    hidden
    (change)="onPhotoSelected($event)"
  />
</div>

<app-fab
  icon="pi pi-camera"
  size="large"
  severity="primary"
  position="bottom-end"
  ariaLabel="Tomar foto"
  (clicked)="cameraInput.click()"
/>
