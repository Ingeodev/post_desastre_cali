<div>
  <input
    #cameraInput
    type="file"
    accept="image/*"
    capture="environment"
    hidden
    (change)="onPhotoSelected($event)"
  />

  @if (photoBlob) {
    <button type="button" (click)="onAccept()">Aceptar</button>
  }

  @for (photo of store.photos(); track photo.id) {
    <img [src]="photo.url" alt="Foto del reporte" />
  }
</div>

<app-fab
  icon="pi pi-camera"
  size="large"
  severity="primary"
  position="bottom-end"
  ariaLabel="Tomar foto"
  (clicked)="cameraInput.click()"
/>
