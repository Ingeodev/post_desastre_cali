<div class="h-full">
  <app-form-stepper
    [title]="'Nuevo reporte de daños'"
    finishLabel="Enviar"
    (cancel)="onCancel()"
    (finish)="onFinish()"
  >
    <app-stepp [position]="0" [validate]="isLocationValid()">
      <div class="h-full overflow-hidden">
        <app-map-form />
      </div>
    </app-stepp>

    <app-stepp [position]="1" [validate]="isDescriptionStepValid()">
      <app-step-description />
    </app-stepp>

    <app-stepp [position]="2" [validate]="isDamageStepValid()">
      <app-step-damage />
    </app-stepp>

    <app-stepp [position]="3" [validate]="isOccupancyStepValid()">
      <app-step-occupancy />
    </app-stepp>

    <app-stepp [position]="4" [validate]="true">
      <app-step-notes />
    </app-stepp>

    <app-stepp [position]="5" [validate]="hasPhotos()">
      <app-attachment-manager />
    </app-stepp>
  </app-form-stepper>
</div>
