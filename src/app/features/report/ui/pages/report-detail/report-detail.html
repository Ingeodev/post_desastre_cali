<section class="mx-auto max-w-3xl p-4">
  @if (store.isLoading()) {
    <div class="space-y-4">
      <div class="h-56 w-full animate-pulse rounded-xl bg-zinc-200 dark:bg-zinc-800"></div>
      <div class="space-y-2">
        <div class="h-4 w-1/2 animate-pulse rounded bg-zinc-200 dark:bg-zinc-800"></div>
        <div class="h-4 w-2/3 animate-pulse rounded bg-zinc-200 dark:bg-zinc-800"></div>
      </div>
    </div>
  } @else if (store.error() || error()) {
    <div class="flex flex-col items-center gap-3 py-16 text-center">
      <span class="pi pi-exclamation-triangle text-4xl text-amber-500" aria-hidden="true"></span>
      <p class="text-sm text-zinc-600 dark:text-zinc-300">
        {{ store.error() || error() }}
      </p>
    </div>
  } @else if (store.profile()) {
    @let profile = store.profile();

    <div class="space-y-6">
      <header>
        <h1 class="text-xl font-semibold text-zinc-900 dark:text-zinc-50">
          {{ profile.inspection.addressText || 'Reporte sin dirección' }}
        </h1>
      </header>

      <app-report-detail-map [location]="profile.inspection.geom" />

      <section>
        <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">
          Información
        </h2>
        <app-report-detail-info [profile]="profile" />
      </section>

      <section>
        <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">
          Patrones de daño
        </h2>
        <app-report-detail-patterns [patterns]="profile.patterns" />
      </section>

      <section>
        <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">
          Fotos
        </h2>
        <app-report-detail-photos [photos]="profile.photos" />
      </section>
    </div>
  }
</section>
