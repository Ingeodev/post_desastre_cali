<section class="mx-auto max-w-3xl p-4">
  <header class="mb-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold text-zinc-900 dark:text-zinc-50">
      Reportes
    </h1>
  </header>

  <div
    class="mb-4 grid grid-cols-2 gap-1 rounded-xl border border-zinc-200 bg-white p-1 shadow-sm dark:border-zinc-800 dark:bg-zinc-900"
  >
    <button
      type="button"
      (click)="store.setSource('local')"
      [class]="
        store.activeSource() === 'local'
          ? 'rounded-lg bg-zinc-900 text-zinc-50 dark:bg-zinc-50 dark:text-zinc-900'
          : 'text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800'
      "
      class="px-3 py-2 text-sm font-medium transition-colors"
    >
      Local
      <span class="ml-1 text-xs opacity-70">{{ store.localCount() }}</span>
    </button>
    <button
      type="button"
      (click)="store.setSource('remote')"
      [class]="
        store.activeSource() === 'remote'
          ? 'rounded-lg bg-zinc-900 text-zinc-50 dark:bg-zinc-50 dark:text-zinc-900'
          : 'text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800'
      "
      class="px-3 py-2 text-sm font-medium transition-colors"
    >
      Remoto
      <span class="ml-1 text-xs opacity-70">{{ store.remoteCount() }}</span>
    </button>
  </div>

  <app-report-list />
</section>
